# Firstspark default configuration.
# Copy to $XDG_CONFIG_HOME/firstspark/config.yaml and edit.

# Memory scanning defaults.
scan:
  # Default value type: byte, word, dword, qword, float, double, string, aob
  value_type: dword
  # Only scan regions that are writable.
  writable_only: true
  # Only report addresses aligned to this many bytes (0 disables alignment).
  alignment: 4
  # Maximum bytes captured by an "unknown initial value" snapshot (bytes).
  snapshot_limit: 2147483648 # 2 GiB
  # Absolute tolerance used when comparing floating point values.
  float_epsilon: 0.000001

# Debugger backend: ptrace (default) or gdbmi.
debugger:
  backend: ptrace
  # Path to the gdb binary used by the gdbmi backend.
  gdb_path: gdb

# Speedhack defaults.
speedhack:
  enabled: false
  # Time scale factor: 1.0 is real time, 2.0 is twice as fast, 0.5 half speed.
  scale: 1.0
  # Step used by the "Speedhack speed +/-" hotkeys.
  delta: 0.5

# Automatic target selection (auto-attach). While no process is
# selected, Firstspark polls for a process whose name matches the pattern and
# selects it, so it re-attaches after the target restarts. Empty disables it.
process:
  # Semicolon-separated name substrings, matched in order, e.g. "game;server".
  # When auto_attach_regex is true the whole value is one regular expression.
  auto_attach: ""
  auto_attach_regex: false

# User interface.
ui:
  # Number of scan results shown at once.
  result_limit: 1000
  # Cheat-table and Found-list refresh interval in milliseconds (minimum 50).
  refresh_ms: 500
  # Palette family: cyberpunk, nord, dracula or tokyo-night.
  theme: cyberpunk
  # Palette variant: light, dark, or system (follow the desktop preference).
  theme_variant: light
  # Interface language code (catalogs live in internal/i18n/locales).
  language: en
  # Interface scale factor (1.0 is the platform default).
  scale: 1.0
  # Base text size in points. Monospace data uses this size minus two.
  font_size: 14
  # Show per-process icons in the process list (resolved from the icon theme).
  process_icons: true

# Diagnostic logging.
log:
  # Level: debug, info, warn or error.
  level: info
  # Log file. Empty uses $XDG_STATE_HOME/firstspark/firstspark.log
  # (~/.local/state/firstspark/firstspark.log by default). One previous file
  # is kept when the log grows past 2 MiB.
  file: ""

# Global hotkeys (X11 only; unavailable under native Wayland). Values are
# combos such as "Ctrl+Alt+S" or "F5"; a letter or digit needs a modifier,
# function keys may stand alone. All actions are unassigned by default and
# are configured from Tools > Hotkeys. Example:
#   hotkeys:
#     speedhack.toggle: Ctrl+Alt+K
#     process.pause: F8
hotkeys: {}

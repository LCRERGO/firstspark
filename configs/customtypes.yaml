# Example user-defined value types.
# Copy to $XDG_CONFIG_HOME/firstspark/customtypes.yaml and edit.
#
# Each type is a fixed-size value with two Lua 5.1 scripts:
#   bytes_to_value(bytes[, address]) -> number or string   (required)
#   value_to_bytes(value[, address]) -> {byte, byte, ...}  (optional)
# A type without value_to_bytes is read-only (no editing or freezing).
# `bytes` is a 1-indexed table of byte integers; `kind` is int, float or string.

types:
  - name: Money
    size: 4
    kind: float
    description: A 32-bit integer scaled by 1/100 (cents).
    script: |
      function bytes_to_value(bytes, address)
        local raw = bytes[1] + bytes[2]*256 + bytes[3]*65536 + bytes[4]*16777216
        return raw / 100
      end
      function value_to_bytes(value, address)
        local raw = math.floor(value * 100)
        return { raw % 256, math.floor(raw/256) % 256, math.floor(raw/65536) % 256, math.floor(raw/16777216) % 256 }
      end

  - name: 2 Bytes Big Endian
    size: 2
    kind: int
    description: A 16-bit big-endian integer.
    script: |
      function bytes_to_value(bytes, address)
        return bytes[1]*256 + bytes[2]
      end
      function value_to_bytes(value, address)
        return { math.floor(value/256) % 256, value % 256 }
      end
